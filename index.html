<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <h1>Bat Ball Stump Game</h1>

    <button
      class="choice-button"
      type="button"
      onclick="
        let computerChoice = genrateComputerChoice();
        let result = getresult('Bat', computerChoice);
        printres('Bat', computerChoice, result);
      "
    >
      <img src="images/bat.png" alt="Bat choice" class="choice-image" />
    </button>

    <button
      class="choice-button"
      type="button"
      onclick="
        computerChoice = genrateComputerChoice();
        result = getresult('Ball', computerChoice);
        printres('Ball', computerChoice, result);
      "
    >
      <img src="images/ball.png" alt="Ball choice" class="choice-image" />
    </button>

    <button
      class="choice-button"
      type="button"
      onclick="
        computerChoice = genrateComputerChoice();
        result = getresult('Stump', computerChoice);
        printres('Stump', computerChoice, result);
      "
    >
      <img src="images/stump.png" alt="Stump choice" class="choice-image" />
    </button>

    <h3 id="user-move"></h3>
    <h3 id="computer-move"></h3>
    <h3 id="result"></h3>
    <h3 id="score"></h3>

    <button
    class="reset-button"
      type="button"
      onclick="
        localStorage.removeItem('Score');
        resetScore();
        printres();
      "
    >
      Reset
    </button>
  </body>
</html>
